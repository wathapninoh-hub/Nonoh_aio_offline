name: Build Ninoh Image AI from uploaded ZIP

on:
  push:
    paths:
      - "Ninoh-Image-AI-Android-fixed.zip"
      - ".github/workflows/build-apk-from-zip.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check uploaded project archive
        run: |
          test -f "Ninoh-Image-AI-Android-fixed.zip" || {
            echo "Upload Ninoh-Image-AI-Android-fixed.zip to the repository root first."
            exit 1
          }

      - name: Extract Android project
        run: |
          mkdir -p imported-project
          unzip -q Ninoh-Image-AI-Android-fixed.zip -d imported-project
          test -f imported-project/android/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK, NDK, and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;26.3.11579264 cmake;3.22.1"

      - name: Fetch stable-diffusion.cpp native engine
        working-directory: imported-project/android
        run: |
          git clone --depth 1 https://github.com/leejet/stable-diffusion.cpp app/src/main/cpp/stable-diffusion.cpp
          git -C app/src/main/cpp/stable-diffusion.cpp submodule update --init --depth 1 ggml

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug and release APKs
        working-directory: imported-project/android
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: NinohImageAI-Android-APKs
          path: |
            imported-project/android/app/build/outputs/apk/debug/*.apk
            imported-project/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
