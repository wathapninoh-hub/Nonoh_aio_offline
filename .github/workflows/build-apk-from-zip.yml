name: Build NINOH API Agent APK

on:
  push:
    paths:
      - "ninoh-api-agent.zip"
      - ".github/workflows/build-apk-from-zip.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check and extract project ZIP
        run: |
          test -f "ninoh-api-agent.zip" || { echo "ninoh-api-agent.zip was not found"; exit 1; }
          mkdir -p extracted-project
          unzip -q ninoh-api-agent.zip -d extracted-project

      - name: Find Android Gradle project
        id: project
        run: |
          SETTINGS=$(find extracted-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "No Android/Gradle project found in ninoh-api-agent.zip."
            echo "The ZIP may contain a web app; it must first be packaged as an Android project."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Gradle project at: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build one debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi
          APK=$(find . -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1)
          test -n "$APK" || { echo "Build finished but no debug APK was produced."; exit 1; }
          cp "$APK" "$GITHUB_WORKSPACE/NINOH-API-AGENT.apk"

      - name: Upload single APK
        uses: actions/upload-artifact@v4
        with:
          name: NINOH-API-AGENT-APK
          path: NINOH-API-AGENT.apk
          if-no-files-found: error
          retention-days: 14
